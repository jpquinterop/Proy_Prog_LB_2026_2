[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "integral-toolkit"
version = "0.1.0"
description = "Librería de cálculo de áreas bajo la curva con métodos numéricos"
requires-python = ">=3.9"
license = "GPL-3.0-only"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.scripts]
integral-toolkit = "calculo_integral.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]